---
name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Build Windows release assets
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@7d7ddabef968d8505aceb8a1f8965afd872f0a0c # v2.4.0
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - name: Install verified Inno Setup compiler
        id: inno
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe
          INNO_SHA256: 5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.0.2-x64.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'inno-setup'
          Invoke-WebRequest $env:INNO_URL -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) {
            throw 'Inno Setup download failed SHA-256 verification.'
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "Inno Setup Authenticode signature is $($signature.Status)."
          }
          $process = Start-Process $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            "/DIR=$directory"
          )
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $compiler = Join-Path $directory 'ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup compiler was not installed.'
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$env:TAG' is not a supported semantic version."
          }
          $version = $Matches[1]
          $expected = (Get-Content version.txt -Raw).Trim()
          if ($version -ne $expected) {
            throw "Tag version '$version' does not match version.txt '$expected'."
          }
          "tag=$env:TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and package release
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          .\scripts\build-release.ps1
          -Version $env:VERSION
          -OutputDirectory artifacts\release
      - name: Build per-user setup executables
        shell: pwsh
        env:
          INNO_COMPILER: ${{ steps.inno.outputs.compiler }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          .\scripts\build-installer.ps1
          -Version $env:VERSION
          -ReleaseDirectory artifacts\release
          -InnoCompiler $env:INNO_COMPILER
      - name: Generate x64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: WindowsCompanion-win-x64
          SYFT_SOURCE_VERSION: ${{ steps.version.outputs.version }}
        with:
          path: artifacts/release/publish/win-x64
          format: spdx-json
          output-file: artifacts/release/WindowsCompanion-${{ steps.version.outputs.version }}-win-x64.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Generate ARM64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: WindowsCompanion-win-arm64
          SYFT_SOURCE_VERSION: ${{ steps.version.outputs.version }}
        with:
          path: artifacts/release/publish/win-arm64
          format: spdx-json
          output-file: artifacts/release/WindowsCompanion-${{ steps.version.outputs.version }}-win-arm64.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SBOM checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts\release\*.spdx.json | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "$($_.FullName).sha256" "$hash  $($_.Name)" -Encoding utf8NoBOM
          }
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ steps.version.outputs.tag }}
          path: |
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-x64-setup.zip
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-x64-setup.zip.sha256
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-arm64-setup.zip
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-arm64-setup.zip.sha256
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-x64.zip.sha256
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-arm64.zip
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-arm64.zip.sha256
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-x64.spdx.json
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-x64.spdx.json.sha256
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-arm64.spdx.json
            artifacts\release\WindowsCompanion-${{ steps.version.outputs.version }}-win-arm64.spdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attest and publish GitHub Release
    needs:
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the immutable GitHub Release and upload its assets.
      id-token: write # Mint the OIDC identity for provenance attestations.
      attestations: write # Store attestations for the caller repository.
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@7d7ddabef968d8505aceb8a1f8965afd872f0a0c # v2.4.0
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.build.outputs.tag }}
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c -- *.sha256
      - name: Generate build-provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/WindowsCompanion-${{ needs.build.outputs.version }}-win-x64-setup.zip
            dist/WindowsCompanion-${{ needs.build.outputs.version }}-win-arm64-setup.zip
            dist/WindowsCompanion-${{ needs.build.outputs.version }}-win-x64.zip
            dist/WindowsCompanion-${{ needs.build.outputs.version }}-win-arm64.zip
            dist/WindowsCompanion-${{ needs.build.outputs.version }}-win-x64.spdx.json
            dist/WindowsCompanion-${{ needs.build.outputs.version }}-win-arm64.spdx.json
      - name: Upload assets and publish draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "release-please did not create the draft Release for ${TAG}" >&2
              exit 1
            fi
            sleep 5
          done
          gh release view "${TAG}" --repo "${REPO}" --json body --jq '.body' \
            > /tmp/release-notes.md
          sed -i '/<!-- windows-companion-installation -->/,$d' /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<EOF

          <!-- windows-companion-installation -->
          ---

          ## Installation

          Download the setup executable matching your PC:

          - **x64** (Intel/AMD): \`WindowsCompanion-${VERSION}-win-x64-setup.zip\`
          - **ARM64**: \`WindowsCompanion-${VERSION}-win-arm64-setup.zip\`

          Extract the setup folder and run its setup executable. It installs per-user
          without administrator rights and adds Start Menu and Apps & Features entries.
          Portable ZIPs remain available as an advanced alternative. All binaries are
          currently unsigned; verify the checksum and GitHub provenance before accepting
          a SmartScreen prompt.
          EOF
          gh release upload "${TAG}" \
            --repo "${REPO}" \
            --clobber \
            "dist/WindowsCompanion-${VERSION}-win-x64-setup.zip" \
            "dist/WindowsCompanion-${VERSION}-win-x64-setup.zip.sha256" \
            "dist/WindowsCompanion-${VERSION}-win-arm64-setup.zip" \
            "dist/WindowsCompanion-${VERSION}-win-arm64-setup.zip.sha256" \
            "dist/WindowsCompanion-${VERSION}-win-x64.zip" \
            "dist/WindowsCompanion-${VERSION}-win-x64.zip.sha256" \
            "dist/WindowsCompanion-${VERSION}-win-arm64.zip" \
            "dist/WindowsCompanion-${VERSION}-win-arm64.zip.sha256" \
            "dist/WindowsCompanion-${VERSION}-win-x64.spdx.json" \
            "dist/WindowsCompanion-${VERSION}-win-x64.spdx.json.sha256" \
            "dist/WindowsCompanion-${VERSION}-win-arm64.spdx.json" \
            "dist/WindowsCompanion-${VERSION}-win-arm64.spdx.json.sha256"
          gh release edit "${TAG}" \
            --repo "${REPO}" \
            --notes-file /tmp/release-notes.md \
            --draft=false
