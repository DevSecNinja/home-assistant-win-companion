<!--
  Hand-hinted 16 px variant of the application mark.

  This is NOT a scaled copy of mark.svg: every edge is aligned to a whole pixel
  on the 16 grid so the notification-area icon rasterises without anti-aliasing
  mush. The knockout gap and the companion halo both reduce to exactly 1 px,
  which is the smallest separation that survives at this size. Do not "correct"
  these coordinates to match the 256 master proportionally - the divergence is
  deliberate hinting.

  Used for the 16 px entry of AppIcon.ico and for the 16 px monochrome exports.
  Single-colour variants are derived from this file by brand/build-assets.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <mask id="companion-halo-16">
      <rect width="16" height="16" fill="#ffffff" />
      <circle cx="12" cy="5" r="3" fill="#000000" />
    </mask>
  </defs>
  <g mask="url(#companion-halo-16)">
    <path d="M 2 6 L 2 5 A 1 1 0 0 1 3 4 L 13 4 A 1 1 0 0 1 14 5 L 14 6 Z" fill="#2DD4BF" />
    <path d="M 2 7 L 14 7 L 14 13 A 1 1 0 0 1 13 14 L 3 14 A 1 1 0 0 1 2 13 Z" fill="#2DD4BF" />
  </g>
  <circle cx="12" cy="5" r="2" fill="#F59E0B" />
</svg>
