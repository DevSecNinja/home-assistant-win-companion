---
name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  brand-assets:
    uses: ./.github/workflows/reusable-brand-assets.yml
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
