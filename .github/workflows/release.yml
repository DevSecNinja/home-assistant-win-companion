---
name: Release candidate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to package without creating a release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Tag '$tag' is not a supported vX.Y.Z SemVer tag."
            }
            "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "create_release=true" >> $env:GITHUB_OUTPUT
          } else {
            if ($env:DISPATCH_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "Version '$env:DISPATCH_VERSION' is not valid SemVer."
            }
            "version=$env:DISPATCH_VERSION" >> $env:GITHUB_OUTPUT
            "create_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: Run tests
        run: .\scripts\test.ps1 -Coverage

      - name: Package unsigned release candidate
        shell: pwsh
        run: >-
          .\scripts\package-release.ps1
          -Version '${{ steps.version.outputs.version }}'

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts\release\${{ steps.version.outputs.version }}\*.zip
            artifacts\release\${{ steps.version.outputs.version }}\*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        if: ${{ steps.version.outputs.create_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $directory = "artifacts\release\$env:VERSION"
          $files = @(
            "$directory\HaCompanion-$env:VERSION-win-x64.zip"
            "$directory\HaCompanion-$env:VERSION-win-x64.zip.sha256"
          )

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $files --clobber
          } else {
            gh release create $env:TAG $files `
              --verify-tag `
              --draft `
              --generate-notes `
              --title "Home Assistant Windows Companion $env:TAG"
          }
