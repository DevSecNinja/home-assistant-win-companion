---
name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  brand-assets:
    name: Brand assets
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.7.14"
          install_args: node
          cache: true
      - name: Install brand tooling
        working-directory: brand
        run: npm ci --no-audit --no-fund
      # Proves the committed icons and images still match the vector masters, so a
      # master can never be edited without the shipped assets being regenerated.
      - name: Verify generated assets match the vector masters
        run: node brand/build-assets.mjs --check

  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore Windows app
        run: >-
          dotnet restore src\WindowsCompanion.App\WindowsCompanion.App.csproj
          -p:Platform=x64 -r win-x64 --nologo
      - name: Restore core tests
        run: >-
          dotnet restore tests\WindowsCompanion.Core.Tests\WindowsCompanion.Core.Tests.csproj
          --nologo
      - name: Restore end-to-end tests
        run: >-
          dotnet restore tests\WindowsCompanion.E2E.Tests\WindowsCompanion.E2E.Tests.csproj
          -p:Platform=x64 -r win-x64 --nologo
      - name: Restore UI tests
        run: >-
          dotnet restore tests\WindowsCompanion.UI.Tests\WindowsCompanion.UI.Tests.csproj
          -p:Platform=x64 -r win-x64 --nologo
      - name: Restore App-boundary tests
        run: >-
          dotnet restore tests\WindowsCompanion.App.Tests\WindowsCompanion.App.Tests.csproj
          --nologo
      - name: Build Windows app
        run: >-
          dotnet build src\WindowsCompanion.App\WindowsCompanion.App.csproj -c Release
          -p:Platform=x64 -r win-x64 --no-restore --nologo
      - name: Upload unsigned Windows x64 build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-x64-${{ github.sha }}
          path: >-
            src\WindowsCompanion.App\bin\x64\Release\net10.0-windows10.0.26100.0\win-x64\**
          if-no-files-found: error
          retention-days: 14
      - name: Run core tests
        id: tests
        run: >-
          dotnet test tests\WindowsCompanion.Core.Tests\WindowsCompanion.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults --nologo
      - name: Run end-to-end tests
        id: e2e-tests
        run: >-
          dotnet test tests\WindowsCompanion.E2E.Tests\WindowsCompanion.E2E.Tests.csproj -c Release
          -p:Platform=x64 -p:PublishReadyToRun=false -r win-x64 --no-restore
          --filter "Category!=Repeatability"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=e2e-test-results.trx"
          --results-directory TestResults --nologo
      - name: Run Debug launch-profile safety tests
        run: >-
          dotnet test tests\WindowsCompanion.E2E.Tests\WindowsCompanion.E2E.Tests.csproj -c Debug
          -p:Platform=x64 -r win-x64 --no-restore
          --filter "FullyQualifiedName~TestAppLaunchOptionsTests"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=launch-profile-test-results.trx"
          --results-directory TestResults --nologo
      - name: Compile UI tests
        run: >-
          dotnet build tests\WindowsCompanion.UI.Tests\WindowsCompanion.UI.Tests.csproj -c Debug
          -p:Platform=x64 -r win-x64 --no-restore --nologo
      - name: Restore Windows ARM64 app
        run: >-
          dotnet restore src\WindowsCompanion.App\WindowsCompanion.App.csproj
          -p:Platform=ARM64 -r win-arm64 --nologo
      - name: Build Windows ARM64 app
        run: >-
          dotnet build src\WindowsCompanion.App\WindowsCompanion.App.csproj -c Release
          -p:Platform=ARM64 -r win-arm64 --no-restore --nologo
      - name: Upload unsigned Windows ARM64 build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-arm64-${{ github.sha }}
          path: >-
            src\WindowsCompanion.App\bin\ARM64\Release\net10.0-windows10.0.26100.0\win-arm64\**
          if-no-files-found: error
          retention-days: 14
      - name: Run App-boundary tests
        id: app-tests
        run: >-
          dotnet test tests\WindowsCompanion.App.Tests\WindowsCompanion.App.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=app-test-results.trx"
          --results-directory TestResults --nologo
      - name: Publish test summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $results = Get-ChildItem TestResults\*.trx -ErrorAction SilentlyContinue
          if (-not $results) {
            "## Test results`n`nNo TRX result was produced." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          @(
            "## Test results"
            ""
            "| Suite | Total | Passed | Failed | Skipped |"
            "| --- | ---: | ---: | ---: | ---: |"
          ) >> $env:GITHUB_STEP_SUMMARY
          foreach ($result in $results) {
            [xml]$trx = Get-Content $result.FullName
            $counters = $trx.TestRun.ResultSummary.Counters
            "| $($result.BaseName) | $($counters.total) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload test results
        if: ${{ always() && (steps.tests.outcome != 'skipped' || steps.app-tests.outcome != 'skipped' || steps.e2e-tests.outcome != 'skipped') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            TestResults\**
          if-no-files-found: error
          retention-days: 14
