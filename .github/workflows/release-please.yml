---
name: Release Please
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release-please:
    # renovate: datasource=github-tags depName=DevSecNinja/.github
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@5eceec313066eefaa0fe9e3dbf4f9a5a49b55ebd # v4.2.0
    permissions:
      contents: write # Create the release branch/tag and update version/changelog files.
      pull-requests: write # Open and update the release pull request.
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
