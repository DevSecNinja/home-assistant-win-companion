---
name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore HaCompanion.sln -p:Platform=x64 --nologo
      - name: Build Windows app
        run: >-
          dotnet build src\HaCompanion.App\HaCompanion.App.csproj -c Release -p:Platform=x64 --no-restore --nologo
      - name: Run core tests
        id: tests
        run: >-
          dotnet test tests\HaCompanion.Core.Tests\HaCompanion.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults --nologo
      - name: Publish test summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $result = Get-Item TestResults\test-results.trx -ErrorAction SilentlyContinue
          if (-not $result) {
            "## Test results`n`nNo TRX result was produced." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          [xml]$trx = Get-Content $result.FullName
          $counters = $trx.TestRun.ResultSummary.Counters
          @(
            "## Test results"
            ""
            "| Total | Passed | Failed | Skipped |"
            "| ---: | ---: | ---: | ---: |"
            "| $($counters.total) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |"
          ) >> $env:GITHUB_STEP_SUMMARY
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults\*.trx
          if-no-files-found: error
          retention-days: 14
