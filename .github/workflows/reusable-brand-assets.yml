---
name: Reusable brand assets
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Brand assets
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.10.18"
          install_args: node
          cache: true
      - name: Install brand tooling
        working-directory: brand
        run: npm ci --no-audit --no-fund
      - name: Verify generated assets match the vector masters
        run: node brand/build-assets.mjs --check
